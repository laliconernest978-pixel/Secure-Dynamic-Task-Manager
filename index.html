<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Dynamic Task Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="app-container">

        <section class="app-card">

            <header class="app-header">
                <p class="eyebrow">Laboratory Activity #2</p>

                <h1>Secure Dynamic Task Manager</h1>

                <p class="subtitle">
                    Create, edit, complete, and remove tasks dynamically and securely.
                </p>
            </header>


            <!-- TASK CONTROLS -->
            <section class="task-controls">

                <label for="taskInput" class="sr-only">
                    Task
                </label>

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a task"
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="addTaskBtn"
                >
                    Add Task
                </button>

                <button
                    type="button"
                    id="loadSamplesBtn"
                    class="secondary-btn"
                >
                    Load Sample Tasks
                </button>

            </section>


            <!-- VALIDATION MESSAGE -->
            <p
                id="taskMessage"
                class="task-message"
                role="alert"
                aria-live="polite"
            ></p>


            <!-- SUMMARY -->
            <section class="summary">

                <div class="summary-card">
                    <span class="summary-label">
                        Total Tasks
                    </span>

                    <strong id="totalCount">0</strong>
                </div>


                <div class="summary-card">
                    <span class="summary-label">
                        Pending
                    </span>

                    <strong id="pendingCount">0</strong>
                </div>


                <div class="summary-card">
                    <span class="summary-label">
                        Completed
                    </span>

                    <strong id="completedCount">0</strong>
                </div>

            </section>


            <!-- TASK LIST -->
            <section class="tasks-section">

                <h2>My Tasks</h2>

                <ul id="taskList"></ul>

            </section>

        </section>

    </main>


    <script
        type="module"
        src="js/app.js"
    ></script>

</body>
</html>
